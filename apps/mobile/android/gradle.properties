org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Real, confirmed fix -- Kotlin's incremental compiler cache throws
# "this and base files have different roots" when the pub cache
# (C:\Users\...\Pub\Cache) and this project (D:\LEAP-MARKETPLACE) are
# on different Windows drive letters, since it can't compute a
# relative path across drives. Disabling incremental compilation
# sidesteps this entirely -- release builds don't benefit much from
# incremental compilation anyway, since they're not rebuilt
# repeatedly the way local dev builds are.
kotlin.incremental=false
