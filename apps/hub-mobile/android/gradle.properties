# Memory for the Android build. Flutter's template asks for 8 GB (-Xmx8G), which crashed the build ("Gradle build daemon disappeared unexpectedly")
# on a PC that also runs the backend, three portals, a database and a browser. 3 GB is what the buyer app (apps/mobile) already uses on this PC.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Same fix the buyer app needed: Kotlin's incremental compiler cache throws "this and base files have different roots" when the pub cache
# (C:\Users\...\Pub\Cache) and this project (D:\LEAP-MARKETPLACE) are on different Windows drive letters. Release builds do not benefit much from
# incremental compilation anyway.
kotlin.incremental=false
