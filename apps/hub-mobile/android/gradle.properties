# Memory for the Android build. Flutter's template asks for 8 GB (-Xmx8G), which crashed the build ("Gradle build daemon disappeared unexpectedly")
# on a PC that also runs the backend, three portals, a database and a browser. 3 GB is what the buyer app (apps/mobile) already uses on this PC.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Same fix the buyer app needed: Kotlin's incremental compiler cache throws "this and base files have different roots" when the pub cache
# (C:\Users\...\Pub\Cache) and this project (D:\LEAP-MARKETPLACE) are on different Windows drive letters. Release builds do not benefit much from
# incremental compilation anyway.
kotlin.incremental=false
# The scanner (mobile_scanner / ML Kit) failed in the RELEASE build with "Camera error: genericError ... on a null object reference" and scrambled class names
# (w4.c, s4.b). Flutter turns on code shrinking and RENAMING for every release build (R8); the scanner finds its own parts by their original names, so
# renaming them breaks it. This is an internal app for the hub's staff, so the few MB saved by shrinking are not worth it. (Flutter reads this property.)
shrink=false
